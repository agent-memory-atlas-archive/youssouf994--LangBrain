<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{page_title}}</title>
<!--THEME_INIT-->
<style>
  /*COMMON_CSS*/
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #notice { display: none; margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--critical); background: var(--panel); }
  #notice.ok { border-color: var(--good); }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 20px 96px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 700px) { main { padding: 12px 16px 96px; } header { padding: 12px 16px; } #notice { margin: 12px 16px 0; } }
  .intro { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text2); }
  .intro p { margin: 0 0 4px; }
  .tabs[hidden] { display: none; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); }
  [role=tab] { border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; padding: 8px 14px; color: var(--text2); }
  [role=tab][aria-selected=true] { background: var(--panel); border-color: var(--border); color: var(--text); font-weight: 600; margin-bottom: -1px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px 18px; }
  .field { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-weight: 600; font-size: 13px; }
  .field code { font-weight: 400; font-size: 11.5px; color: var(--muted); margin-left: 6px; }
  .field input[type=text], .field input[type=password], .field input[type=number], .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .field.changed input, .field.changed select, .field.changed textarea { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--critical); box-shadow: inset 0 0 0 1px var(--critical); }
  .help { font-size: 12px; color: var(--muted); }
  .err { font-size: 12px; color: var(--critical); }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--border); color: var(--text2); margin-left: 6px; font-weight: 400; }
  .badge.warn { border-color: var(--warning); }
  .badge.good { border-color: var(--good); }
  .inline { display: flex; align-items: center; gap: 8px; }
  .inline input[type=checkbox] { width: 18px; height: 18px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  #bar .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1 id="page-h1">{{title}}</h1>
  <!--NAV:settings-->
  <label class="row" for="key">{{api_key}} <input id="key" type="password" autocomplete="off" placeholder="X-API-Key" size="14"></label>
  <button id="use-key" type="button">{{use}}</button>
  <a id="lang-switch" href="?lang={{other_lang}}" hreflang="{{other_lang}}">{{other_lang_name}}</a>
</header>
<div id="notice" role="alert"></div>
<main>
  <div class="intro"><p id="intro">{{intro}}</p><p class="muted">{{admin_note}}</p></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel" role="tabpanel"><div class="muted">{{loading}}</div></div>
  <p class="muted" id="not-editable">{{not_editable_note}}</p>
</main>
<div id="bar">
  <span id="count" class="muted"></span>
  <span class="spacer"></span>
  <button id="restart" type="button" hidden>{{restart_app}}</button>
  <button id="restore" type="button">{{restore}}</button>
  <button id="discard" type="button">{{discard}}</button>
  <button id="save" type="button" class="primary">{{save}}</button>
</div>
<script type="application/json" id="i18n">/*I18N*/</script>
<script>
/*SETTINGS_FORM_JS*/
</script>
</body>
</html>

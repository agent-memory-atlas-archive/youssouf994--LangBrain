name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Suite di test (database temporanei, nessun LLM reale)
        run: python -m pytest tests -q

  sicurezza:
    name: Segreti e dipendenze
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa gitleaks (checksum verificato) e pip-audit
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip install pip-audit
      # Scansiona tutta la cronologia (non solo l'intervallo del push: un primo push non ha un commit precedente) e le dipendenze fissate
      - name: Scansione di segreti e dipendenze
        run: bash scripts/scansione_sicurezza.sh

name: Notify nodes

# When the core changes, tells the repositories of the nodes built on it (their core-sync workflow merges it and opens a PR).
# Set the repository variable NODE_REPOS (comma-separated "owner/name") and the secret NODES_DISPATCH_TOKEN (a token that can
# dispatch workflows on those repositories). Without them the job does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Notify the nodes
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch to every node
        env:
          GH_TOKEN: ${{ secrets.NODES_DISPATCH_TOKEN }}
          NODE_REPOS: ${{ vars.NODE_REPOS }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$NODE_REPOS" ]; then echo "No nodes configured: nothing to do."; exit 0; fi
          for repo in $(echo "$NODE_REPOS" | tr ',' ' '); do
            gh api "repos/$repo/dispatches" -f event_type=core-updated -f "client_payload[sha]=$GITHUB_SHA"
            echo "notified $repo"
          done
